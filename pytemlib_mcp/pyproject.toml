[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytemlib-mcp"
version = "0.1.0"
description = "pyTEMlib's analysis as MCP tools: EELS, EDS, peak fitting, images, probe and reference data"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyTEMlib",
    "fastmcp>=3.2.4",
    "h5py>=3.0",
    "dask",
    "tiled[client]>=0.2.9,<0.3",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4.0", "tiled[server]>=0.2.9,<0.3"]

[project.scripts]
pytemlib-mcp = "pytemlib_mcp.server:main"
pytemlib-analysis-server = "pytemlib_mcp.analysis_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
